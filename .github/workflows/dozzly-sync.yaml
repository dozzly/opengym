# dozzly/opengym: keeps the trainer branch on top of upstream's releases (ADR 029 in
# dozzly/dozzly-cluster, docs/decisions/029-opengym-trainer-delivery.md). See dozzly/README.md.
#
# release     daily, and by hand: fast-forwards this fork's `main` to upstream `main`. When upstream
#             has a newer v* release than dozzly/UPSTREAM, rebases dozzly/trainer onto it
#             (`git rebase --onto <new> <old>`), runs upstream's own suites and the module's tests,
#             builds ghcr.io/dozzly/opengym-api (upstream's default target) and -web as
#             <version>-dozzly.<n> (linux/amd64, the cluster's only architecture), and pushes the
#             branch and a build tag. The run summary carries the digests; the digest-pin pull
#             request is opened from dozzly/dozzly-cluster's side. A conflict or a failing suite
#             opens an issue here instead, and nothing is pushed or built.
# main-check  nightly: the same rebase onto upstream `main` HEAD and the same tests, as an early
#             warning of what the next release will bring. Never pushes, builds or deploys.
#
# Secrets:
#   FORK_DEPLOY_KEY    private half of a deploy key of this repository with write access. Pushes
#                      go over it, not GITHUB_TOKEN: a rebase onto upstream carries upstream's own
#                      changes to .github/workflows/, and GitHub refuses a GITHUB_TOKEN push that
#                      touches a workflow file. Required by `release`.
#
# Runners: the `opengym` runner scale set on the homelab cluster (ARC, Docker-in-Docker; defined in
# dozzly/dozzly-cluster infrastructure/ci/actions-runner-controller/). Its image has git, docker,
# buildx, jq, python3 and curl but no `gh`, so GitHub API calls below use curl.
#
# Scheduled runs only start from the default branch, so dozzly/trainer is this fork's default.
name: "dozzly: follow upstream releases"

on:
  schedule:
    - cron: '17 5 * * *'    # release
    - cron: '43 1 * * *'    # main-check
  workflow_dispatch:
    inputs:
      mode:
        description: release (follow the newest upstream release) or main-check (test against upstream main only)
        type: choice
        options: [release, main-check]
        default: release
      build:
        description: "release: build and propose images even without a newer upstream release (first build, module changes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One release run at a time, whether scheduled or started by hand; the nightly check apart.
  group: dozzly-sync-${{ (github.event.schedule == '43 1 * * *' || inputs.mode == 'main-check') && 'main-check' || 'release' }}
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/DuarteSantos8/openGym.git
  BRANCH: dozzly/trainer
  IMAGE_PREFIX: ghcr.io/dozzly/opengym
  UPSTREAM_IMAGE_PREFIX: ghcr.io/duartesantos8/opengym

jobs:
  release:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 5 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
    runs-on: opengym
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      packages: write
    env:
      FORCE_BUILD: ${{ inputs.build == true }}
    steps:
      - name: Deploy key present
        env:
          KEY: ${{ secrets.FORK_DEPLOY_KEY }}
        run: |
          echo "plan" > "$RUNNER_TEMP/stage"
          if [ -z "$KEY" ]; then
            echo "::error::FORK_DEPLOY_KEY is not set. Add a write deploy key to this repository and its private half as this secret (dozzly/README.md, one-time setup)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          ssh-key: ${{ secrets.FORK_DEPLOY_KEY }}

      - name: Fetch upstream
        run: |
          git config user.name "dozzly-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --quiet "$UPSTREAM_URL" '+refs/heads/main:refs/remotes/upstream/main' '+refs/tags/v*:refs/tags/v*'
          echo "REMOTE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The fork's main mirrors upstream's, fast-forward only. A main that has diverged is reported
      # and left alone; it does not stop the trainer branch from following the release.
      - name: Fast-forward main
        run: |
          git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main' || true
          if git rev-parse --verify --quiet origin/main >/dev/null && ! git merge-base --is-ancestor origin/main upstream/main; then
            echo "::warning::this fork's main has commits upstream main does not; not fast-forwarded"
            echo "- main: diverged from upstream main, left alone" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$(git rev-parse upstream/main)" != "$(git rev-parse --verify --quiet origin/main || true)" ]; then
            git push origin 'refs/remotes/upstream/main:refs/heads/main'
          fi

      - name: Plan
        id: plan
        run: |
          # dozzly/UPSTREAM names the upstream base: a release tag, or an upstream main commit when
          # the branch was brought up to upstream main between releases.
          old=$(tr -d '[:space:]' < dozzly/UPSTREAM)
          new=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          git rev-parse --verify --quiet "$old^{commit}" >/dev/null || { echo "::error::dozzly/UPSTREAM names $old, which is not an upstream tag or commit"; exit 1; }
          git merge-base --is-ancestor "$old" upstream/main || { echo "::error::dozzly/UPSTREAM $old is not on upstream main"; exit 1; }
          # A newer release is one the base does not contain yet.
          rebase=false
          if ! git merge-base --is-ancestor "$new" "$old"; then rebase=true; fi
          build=$rebase
          if [ "$FORCE_BUILD" = true ]; then build=true; fi
          {
            echo "old=$old"; echo "new=$new"; echo "rebase=$rebase"; echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "OLD=$old" >> "$GITHUB_ENV"; echo "NEW=$new" >> "$GITHUB_ENV"
          echo "### dozzly sync: based on $old, newest upstream release $new (rebase: $rebase, build: $build)" >> "$GITHUB_STEP_SUMMARY"

      - name: Rebase onto ${{ steps.plan.outputs.new }}
        if: steps.plan.outputs.rebase == 'true'
        run: |
          echo "rebase onto $NEW" > "$RUNNER_TEMP/stage"
          if ! git merge-base --is-ancestor "$OLD" "$NEW"; then
            echo "upstream $NEW does not descend from $OLD" > "$RUNNER_TEMP/detail"
            exit 1
          fi
          if ! git rebase --onto "$NEW" "$OLD" "$BRANCH"; then
            { echo "Conflicting files:"; git diff --name-only --diff-filter=U | sed 's/^/- /'; } > "$RUNNER_TEMP/detail"
            git rebase --abort
            exit 1
          fi
          # The base moves into dozzly/UPSTREAM as a fixup of the commit that last set it, so the
          # branch stays the release, the seam commit and the module's commits.
          printf '%s\n' "$NEW" > dozzly/UPSTREAM
          git commit --quiet --fixup="$(git log -n 1 --format=%H -- dozzly/UPSTREAM)" -- dozzly/UPSTREAM
          GIT_SEQUENCE_EDITOR=: git rebase --quiet --interactive --autosquash "$NEW"
          git log --oneline "$NEW..HEAD" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json
            mcp/package-lock.json
            package-lock.json

      - name: Upstream suites and module tests
        if: steps.plan.outputs.build == 'true'
        env:
          DOZZLY_REPORT: ${{ runner.temp }}/tests.md
        run: |
          echo "tests" > "$RUNNER_TEMP/stage"
          sh dozzly/test.sh && rc=0 || rc=$?
          cat "$DOZZLY_REPORT" >> "$GITHUB_STEP_SUMMARY"
          cp "$DOZZLY_REPORT" "$RUNNER_TEMP/detail"
          exit "$rc"

      - name: Build tag
        if: steps.plan.outputs.build == 'true'
        run: |
          echo "build tag" > "$RUNNER_TEMP/stage"
          # A build carries a release's version only if what goes into the images is that release.
          # A base past the release (upstream main) may differ only outside them: docs, the website,
          # the OpenAPI text (api/Dockerfile copies an explicit list that leaves it out).
          base=$(tr -d '[:space:]' < dozzly/UPSTREAM)
          rel=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$base")
          if ! git diff --quiet "$rel" "$base" -- api frontend web ':(exclude)api/openapi.yaml'; then
            { echo "The base $base carries upstream app code that $rel does not:"; git diff --stat "$rel" "$base" -- api frontend web ':(exclude)api/openapi.yaml' | sed 's/^/    /'; echo; echo "Builds follow releases (ADR 029). Wait for the next release, or set dozzly/UPSTREAM back to $rel."; } > "$RUNNER_TEMP/detail"
            exit 1
          fi
          ver=${rel#v}
          n=$(git ls-remote --tags origin "refs/tags/dozzly/build/${ver}-dozzly.*" | sed -n "s#.*refs/tags/dozzly/build/${ver}-dozzly\.\([0-9][0-9]*\)\$#\1#p" | sort -n | tail -n 1)
          tag="${ver}-dozzly.$(( ${n:-0} + 1 ))"
          { echo "VERSION=$ver"; echo "TAG=$tag"; echo "BUILD_N=$(( ${n:-0} + 1 ))"; echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "SHA=$(git rev-parse HEAD)"; } >> "$GITHUB_ENV"

      # Upstream's api-image job in miniature: the default target boots, serves, and carries the
      # module, off unless TRAINER is set.
      - name: Smoke-test the api image
        if: steps.plan.outputs.build == 'true'
        run: |
          echo "api image smoke test" > "$RUNNER_TEMP/stage"
          docker build --quiet --target default -t smoke-api ./api >/dev/null
          probe() { for _ in $(seq 1 30); do curl -fsS "http://localhost:$1/api/config" >/dev/null 2>&1 && return 0; sleep 1; done; return 1; }
          docker run -d --name api-off -e DATA_DIR=/data -p 3000:3000 smoke-api
          docker run -d --name api-on -e DATA_DIR=/data -e TRAINER=1 -p 3001:3000 smoke-api
          probe 3000 && probe 3001
          curl -fsS http://localhost:3000/api/config | grep -q '"invite_only"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/trainer/status)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/trainer/status)" = 401
          docker run --rm smoke-api node -e 'import("@anthropic-ai/claude-agent-sdk").then(()=>process.exit(1),()=>process.exit(0))'
          docker rm -f api-off api-on

      - uses: docker/setup-buildx-action@v4
        if: steps.plan.outputs.build == 'true'
        with:
          # The runner's Docker-in-Docker bridge (docker0) is MTU 1500, but the pod's own interface
          # is 1450 (Cilium). A BuildKit container on that bridge loses large packets, and ghcr.io's
          # TLS handshakes time out on push. Host networking puts BuildKit on the pod's interface.
          driver-opts: network=host
      - uses: docker/login-action@v4.6.0
        if: steps.plan.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark the image stage
        if: steps.plan.outputs.build == 'true'
        run: echo "image build" > "$RUNNER_TEMP/stage"

      # The default target, named: what upstream publishes untargeted and the cluster runs today.
      # Named so a reordering of upstream's stages fails here instead of shipping the Coach target.
      - name: Build and push the api image
        id: api
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          target: default
          platforms: linux/amd64
          push: true
          # <version>-dozzly.<n> names this build; the plain upstream <version> moves to it, so the cluster
          # pins the upstream version plus digest and version-checker compares it with upstream's
          # releases (a suffixed tag reads as a pre-release, always behind upstream).
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ env.TAG }}
            ${{ env.IMAGE_PREFIX }}-api:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.TAG }}
            VCS_REF=${{ env.SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/pkgs/container/opengym-api
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ env.BRANCH }}/dozzly/README.md
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ env.SHA }}

      - name: Build and push the web image
        id: web
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: true
          # <version>-dozzly.<n> names this build; the plain upstream <version> moves to it, so the cluster
          # pins the upstream version plus digest and version-checker compares it with upstream's
          # releases (a suffixed tag reads as a pre-release, always behind upstream).
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ env.TAG }}
            ${{ env.IMAGE_PREFIX }}-web:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.TAG }}
            VCS_REF=${{ env.SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            APP_BUILD=dozzly.${{ env.BUILD_N }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/pkgs/container/opengym-web
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ env.BRANCH }}/dozzly/README.md
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ env.SHA }}

      # The branch and a tag naming the exact source of these images (AGPL-3.0 s.13), in one
      # atomic push. The lease fails it if anyone pushed to the branch since this run read it.
      - name: Push the branch and the build tag
        if: steps.plan.outputs.build == 'true'
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          echo "push" > "$RUNNER_TEMP/stage"
          git push --atomic --force-with-lease="refs/heads/$BRANCH:$REMOTE_HEAD" origin \
            "HEAD:refs/heads/$BRANCH" "HEAD:refs/tags/dozzly/build/$TAG"
          {
            echo ""
            echo "Built \`$TAG\` from $SHA:"
            echo "- \`$IMAGE_PREFIX-api:$TAG@$API_DIGEST\`"
            echo "- \`$IMAGE_PREFIX-web:$TAG@$WEB_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          stage=$(cat "$RUNNER_TEMP/stage" 2>/dev/null || echo "setup")
          title="dozzly sync failed: ${NEW:-upstream} (${stage})"
          {
            echo "The release sync stopped at **${stage}**. Nothing was pushed to \`$BRANCH\` and no image was published for this run."
            echo
            echo "- Based on: \`${OLD:-?}\`; newest upstream release: \`${NEW:-?}\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat "$RUNNER_TEMP/detail" 2>/dev/null || true
            echo
            echo "To fix by hand: dozzly/README.md, \"When the sync opens an issue\"."
          } > "$RUNNER_TEMP/issue.md"
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          # The open issue with exactly this title, if any (the runner image has no gh).
          find_issue() { api "https://api.github.com/repos/$GH_REPO/issues?state=open&per_page=100" | jq -r --arg t "$1" '[.[] | select(.pull_request == null and .title == $t)][0].number // empty'; }
          post() { jq -n --arg title "$2" --rawfile body "$3" '{title: $title, body: $body}' | api -X POST "https://api.github.com/repos/$GH_REPO/$1" -d @- >/dev/null; }
          existing=$(find_issue "$title" || true)
          if [ -n "$existing" ]; then post "issues/$existing/comments" "" "$RUNNER_TEMP/issue.md"
          else post issues "$title" "$RUNNER_TEMP/issue.md"; fi \
            || echo "::error::could not open an issue (are Issues enabled on this fork?)"

  main-check:
    if: (github.event_name == 'schedule' && github.event.schedule == '43 1 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'main-check')
    runs-on: opengym
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      TITLE: "dozzly early warning: upstream main breaks the trainer branch"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase onto upstream main (not pushed)
        id: rebase
        run: |
          echo "rebase onto upstream main" > "$RUNNER_TEMP/stage"
          git config user.name "dozzly-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --quiet "$UPSTREAM_URL" '+refs/heads/main:refs/remotes/upstream/main' '+refs/tags/v*:refs/tags/v*'
          old=$(tr -d '[:space:]' < dozzly/UPSTREAM)
          echo "OLD=$old" >> "$GITHUB_ENV"
          echo "MAIN=$(git rev-parse --short upstream/main)" >> "$GITHUB_ENV"
          if ! git rebase --onto upstream/main "$old" "$BRANCH"; then
            { echo "Conflicting files:"; git diff --name-only --diff-filter=U | sed 's/^/- /'; } > "$RUNNER_TEMP/detail"
            git rebase --abort
            exit 1
          fi
          echo "rebased $(git rev-list --count "$old..upstream/main") upstream commits past $old cleanly" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json
            mcp/package-lock.json
            package-lock.json

      - name: Upstream suites and module tests
        env:
          DOZZLY_REPORT: ${{ runner.temp }}/tests.md
        run: |
          echo "tests" > "$RUNNER_TEMP/stage"
          sh dozzly/test.sh && rc=0 || rc=$?
          cat "$DOZZLY_REPORT" >> "$GITHUB_STEP_SUMMARY"
          cp "$DOZZLY_REPORT" "$RUNNER_TEMP/detail"
          exit "$rc"

      - name: Close the warning once main passes again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          # The open issue with exactly this title, if any (the runner image has no gh).
          find_issue() { api "https://api.github.com/repos/$GH_REPO/issues?state=open&per_page=100" | jq -r --arg t "$1" '[.[] | select(.pull_request == null and .title == $t)][0].number // empty'; }
          post() { jq -n --arg title "$2" --rawfile body "$3" '{title: $title, body: $body}' | api -X POST "https://api.github.com/repos/$GH_REPO/$1" -d @- >/dev/null; }
          n=$(find_issue "$TITLE" || true)
          if [ -n "$n" ]; then
            printf 'Upstream main %s rebases and passes again.\n' "$MAIN" > "$RUNNER_TEMP/close.md"
            post "issues/$n/comments" "" "$RUNNER_TEMP/close.md" || true
            api -X PATCH "https://api.github.com/repos/$GH_REPO/issues/$n" -d '{"state":"closed"}' >/dev/null || true
          fi

      - name: Report as an early-warning issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          stage=$(cat "$RUNNER_TEMP/stage" 2>/dev/null || echo "setup")
          {
            echo "Early warning only: nothing was pushed, built or deployed. The trainer branch, rebased onto upstream main \`${MAIN:-?}\` (past \`${OLD:-?}\`), failed at **${stage}**. The next upstream release will likely do the same."
            echo
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat "$RUNNER_TEMP/detail" 2>/dev/null || true
          } > "$RUNNER_TEMP/issue.md"
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          # The open issue with exactly this title, if any (the runner image has no gh).
          find_issue() { api "https://api.github.com/repos/$GH_REPO/issues?state=open&per_page=100" | jq -r --arg t "$1" '[.[] | select(.pull_request == null and .title == $t)][0].number // empty'; }
          post() { jq -n --arg title "$2" --rawfile body "$3" '{title: $title, body: $body}' | api -X POST "https://api.github.com/repos/$GH_REPO/$1" -d @- >/dev/null; }
          existing=$(find_issue "$TITLE" || true)
          if [ -n "$existing" ]; then post "issues/$existing/comments" "" "$RUNNER_TEMP/issue.md"
          else post issues "$TITLE" "$RUNNER_TEMP/issue.md"; fi \
            || echo "::error::could not open an issue (are Issues enabled on this fork?)"
